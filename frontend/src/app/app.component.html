<div class="app">
  <aside class="sidebar">
    <div class="brand">ChefWise</div>
    <nav class="side">
      <a class="nav-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a class="nav-item" routerLink="/sorprendeme" routerLinkActive="active">Sorpréndeme</a>
      <a class="nav-item" routerLink="/con-lo-que-tengo" routerLinkActive="active">Con lo que tengo</a>
      <a class="nav-item" routerLink="/mi-cocina" routerLinkActive="active">Mi cocina</a>
    </nav>
    <button
      class="theme-toggle"
      type="button"
      role="switch"
      [attr.aria-checked]="theme.isDark()"
      [title]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      (click)="theme.toggle()"
    >
      @if (theme.isDark()) { <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg> <span>Modo claro</span> } @else { <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg> <span>Modo oscuro</span> }
    </button>
    <div class="sidebar-foot">ChefWise</div>
  </aside>

  <main>
    <router-outlet />
  </main>
</div>

<nav class="bottom-nav">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
  <a routerLink="/sorprendeme" routerLinkActive="active">Sorpréndeme</a>
  <a routerLink="/con-lo-que-tengo" routerLinkActive="active">Tengo</a>
  <a routerLink="/mi-cocina" routerLinkActive="active">Mi cocina</a>
  <button
    class="theme-toggle-mobile"
    type="button"
    [attr.aria-label]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
    (click)="theme.toggle()"
  >
    @if (theme.isDark()) { <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg> } @else { <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg> }
    <span>{{ theme.isDark() ? 'Claro' : 'Oscuro' }}</span>
  </button>
</nav>

<!-- Global: visible en cualquier vista, no solo dentro de una receta -->
<app-chat-widget />

@if (recipeService.lastHidden(); as r) {
  <div class="toast" role="status">
    <span>No volveremos a mostrarte «{{ r.name }}»</span>
    <button (click)="recipeService.undoLastHide()">Deshacer</button>
    <button class="close" title="Cerrar" (click)="recipeService.dismissLastHidden()">×</button>
  </div>
}
